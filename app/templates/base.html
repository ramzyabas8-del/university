<!doctype html><html lang="{{lang}}" dir="{{'rtl' if lang=='ar' else 'ltr'}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{tr('app')}}</title><link rel="stylesheet" href="/static/style.css"></head><body><header><b>🎓 {{tr('app')}}</b>{% if user %}<nav><a href="/dashboard">{{tr('dashboard')}}</a><a href="/ask">{{tr('ask')}}</a><a href="/regulations">{{tr('regulations')}}</a><a href="/history">{{tr('history')}}</a>{% if user.role=='admin' %}<a href="/admin/upload">{{tr('upload')}}</a><a href="/users">{{tr('users')}}</a>{% endif %}</nav><span>{{user.username}} · <a href="/language/{{'en' if lang=='ar' else 'ar'}}">{{'English' if lang=='ar' else 'العربية'}}</a> · <button onclick="document.body.classList.toggle('dark')">☾/☀</button> · <a href="/logout">{{tr('logout')}}</a></span>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
