{% extends 'base.html' %}{% block content %}<h1>👥 {{tr('users')}}</h1>{% if error %}<div class="err">{{error}}</div>{% endif %}<div class="grid"><div class="card form"><h2>إضافة مستخدم</h2><form method="post"><label>اسم المستخدم</label><input name="username" required><label>كلمة المرور</label><input type="password" name="password" minlength="8" required><label>الصلاحية</label><select name="role"><option value="viewer">Viewer</option><option value="admin">Admin</option></select><button>حفظ</button></form></div><div class="card">{% for u in rows %}<div class="row"><span><b>{{u.username}}</b><small>{{u.role}}</small></span>{% if u.id != user.id %}<form method="post" action="/users/{{u.id}}/toggle"><button class="small">{{'تعطيل' if u.active else 'تفعيل'}}</button></form>{% endif %}</div>{% endfor %}</div></div>{% endblock %}
